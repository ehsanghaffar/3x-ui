<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subscription</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            color: #eee;
        }
        main {
            width: 90%;
            max-width: 700px;
            padding: 40px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        h1 { font-size: 20px; margin-bottom: 5px; }
        .id { font-size: 12px; color: #999; margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .item { padding: 10px; background: #1a1a1a; border-radius: 4px; }
        .label { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 3px; }
        .value { font-size: 16px; font-weight: bold; }
        h2 { font-size: 13px; margin: 30px 0 10px 0; text-transform: uppercase; color: #4CAF50; }
        .links { max-height: 300px; overflow-y: auto; background: #1a1a1a; border-radius: 4px; padding: 8px; }
        .link { padding: 8px; margin-bottom: 5px; background: #333; border-radius: 3px; font-family: monospace; font-size: 11px; word-break: break-all; line-height: 1.3; }
        .link:last-child { margin-bottom: 0; }
        button { margin-top: 20px; padding: 10px 20px; background: #4CAF50; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <main>
        <h1>Subscription: {{.sId}}</h1>
        <div class="id">ID: {{.sId}}</div>

        <div class="grid">
            <div class="item"><div class="label">Download</div><div class="value">{{.download}}</div></div>
            <div class="item"><div class="label">Upload</div><div class="value">{{.upload}}</div></div>
            <div class="item"><div class="label">Total</div><div class="value">{{.total}}</div></div>
            <div class="item"><div class="label">Used</div><div class="value">{{.used}}</div></div>
            {{if gt .totalByte 0}}
            <div class="item"><div class="label">Remaining</div><div class="value">{{.remained}}</div></div>
            {{end}}
            <div class="item"><div class="label">Expires</div><div class="value">{{if eq .expire 0}}Never{{else}}{{.expire}}{{end}}</div></div>
        </div>

        <h2>Proxy Links</h2>
        <div class="links">
            {{range .result}}
            <div class="link">{{.}}</div>
            {{end}}
        </div>

        <button onclick="copy()">📋 Copy All Links</button>
    </main>

    <script>
        function copy() {
            const text = Array.from(document.querySelectorAll('.link')).map(e => e.textContent).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied!');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('Copied!');
            });
        }
    </script>
</body>
</html>
